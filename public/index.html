<!DOCTYPE html>
<html>
<head>
    <title>APK Reverse Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network/standalone/umd/vis-network.min.js"></script>
</head>

<body style="margin:0; font-family:Arial;">

<div style="display:flex; height:100vh;">

    <!-- GRAPH -->
    <div id="graph" style="width:50%; border-right:1px solid #ccc;"></div>

    <!-- LIVE LOG -->
    <div style="width:50%; display:flex; flex-direction:column;">

        <div style="padding:10px; background:#111; color:white;">
            LIVE MITM + REPLAY PANEL
        </div>

        <div id="log" style="flex:1; overflow:auto; padding:10px;"></div>

        <button onclick="replayLast()">REPLAY LAST REQUEST</button>
    </div>

</div>

<script>
let lastRequest = null;

// =========================
// GRAPH (STATIC)
fetch("/graph")
.then(r=>r.json())
.then(data=>{
    const nodes = new vis.DataSet(
        data.nodes.map(n=>({id:n,label:n}))
    );

    const edges = new vis.DataSet(
        data.edges.map(e=>({from:e.from,to:e.to}))
    );

    new vis.Network(document.getElementById("graph"), {
        nodes, edges
    }, { physics:true });
});

// =========================
// WS REALTIME MITM
const ws = new WebSocket("ws://localhost:8081");

ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    const log = document.getElementById("log");

    const div = document.createElement("div");
    div.style.borderBottom = "1px solid #ddd";
    div.style.padding = "5px";

    div.innerHTML = `
        <b>${data.type}</b><br/>
        ${data.url || ""}<br/>
        <button onclick='selectReq(${JSON.stringify(data)})'>select</button>
    `;

    log.appendChild(div);

    if(data.type === "request"){
        lastRequest = data;
    }
};

// =========================
// SELECT REQUEST
function selectReq(data){
    lastRequest = data;
    alert("Selected request:\n" + data.url);
}

// =========================
// REPLAY API
function replayLast(){

    if(!lastRequest){
        alert("No request selected");
        return;
    }

    fetch("/replay", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(lastRequest)
    })
    .then(r=>r.json())
    .then(res=>{
        alert("Replay result:\n" + JSON.stringify(res,null,2));
    });
}
</script>

</body>
</html>
